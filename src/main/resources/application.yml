# 服务端口
server:
  port: 9002

spring:
  application:
    # 应用名称：Nacos注册的服务名，也是配置中心dataId前缀
    name: cr-user
  cloud:
    nacos:
      # Nacos注册中心与配置中心地址
      server-addr: localhost:8848
      discovery:
        # 服务分组（namespace留空即使用默认public命名空间）
        group: DEFAULT_GROUP
      config:
        # 配置分组（namespace留空即使用默认public命名空间）
        group: DEFAULT_GROUP
  config:
    # 从Nacos配置中心导入 dataId=${app.name}.yaml
    # 数据源、Jackson、MyBatis-Plus、Feign、日志等业务配置均在Nacos统一管理
    import: optional:nacos:${spring.application.name}.yaml

  # ==== 本地兜底数据源：Nacos不可达时使用；Nacos可达时被cr-user.yaml覆盖 ====
  datasource:
    # 数据库驱动
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接地址
    url: jdbc:mysql://localhost:3306/car_rental?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: root
    # 数据库密码
    password: root
